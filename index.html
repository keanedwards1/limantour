<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Beach Sunset Drone</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="vignette"></div>

  <div class="prompt" id="prompt">Click anywhere for sound</div>
  <button class="sound" id="sound" aria-label="Toggle sound (M)" title="Toggle sound (M)">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
      <path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor" />
      <g class="waves" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M16 9.5a3.5 3.5 0 0 1 0 5" />
        <path d="M18.5 7a7 7 0 0 1 0 10" />
      </g>
      <path class="cross" d="M16 9.5l5 5M21 9.5l-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
    </svg>
  </button>
  <script type="module" src="main.js"></script>
</body>
</html>
